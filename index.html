function pickVoice() { try { const vs = speechSynthesis.getVoices(); VOICE = vs.find(v => /es[-_]MX/i.test(v.lang)) || vs.find(v => /^es/i.test(v.lang)) || null; } catch (e) {} }

/* =========================================================
   Construcción de la sesión (5 pilares automáticos)
   ========================================================= */
function resolve(item) { return typeof item === 'string' ? EX[item] : item; }
function scaled(ex, lvl) { return Math.max(1, Math.round(ex.v * (1 + (lvl - 1) * 0.1))); }
const EXPRESS_MAX = { mob: 3, tec: 3, drill: 2, str: 2, core: 1 };
const isExpress = () => S.settings.mode === 'express';
function buildSteps(k) {
  const steps = []; const rest = isExpress() ? Math.min(10, S.settings.rest) : S.settings.rest;
  ORDER.forEach((p, bi) => {
    let items = (k.plan[p] || []).map(resolve);
    if (isExpress()) items = items.slice(0, EXPRESS_MAX[p]);
    steps.push({ type: 'block', pillar: p, block: bi + 1, items: items.map(x => x.n) });
    const sets = isExpress() ? 1 : SETS[p];
    for (let set = 1; set <= sets; set++) {
      items.forEach((ex, xi) => {
        const sides = ex.s ? (k.track === 'box' ? ['Lado derecho', 'Lado izquierdo'] : ['Pierna derecha', 'Pierna izquierda']) : [null];
        sides.forEach(side => steps.push({ type: 'work', pillar: p, ex, t: ex.t, v: scaled(ex, k.lvl), side, set, sets }));
        const lastOfBlock = set === sets && xi === items.length - 1;
        if (p !== 'mob' && rest > 0 && !(lastOfBlock && bi === ORDER.length - 1)) steps.push({ type: 'rest', pillar: p, v: rest });
      });
    }
  });
  return steps;
}
function estimateMin(k) {
  const prep = S.settings.prep;
  const sec = buildSteps(k).reduce((a, s) => a + (s.type === 'block' ? 5 : s.type === 'rest' ? s.v : s.t === 't' ? s.v + prep : s.v * 3.5 + 4), 0);
  return Math.round(sec / 60);
}

/* =========================================================
   Reproductor de rutina guiada
   ========================================================= */
let P = null;
const RING_C = 2 * Math.PI * 88;
function startLesson(id) {
  const k = ITEM[id];
  P = { kick: k, steps: buildSteps(k), i: 0, startedAt: Date.now(), reps: 0, paused: false, timer: null, gtimer: null, phase: null };
  UI.view = 'player'; UI.sheet = null;
  beep(1, 0.01, 0.0001);
  wake(true); enterStep();
}
function curStep() { return P.steps[P.i]; }
function clearTimers() { if (P) { clearInterval(P.timer); clearInterval(P.gtimer); P.timer = P.gtimer = null; } }
function setCountdown(sec) { clearInterval(P.timer); P.total = sec; P.left = sec; P.endAt = Date.now() + sec * 1000; P.paused = false; P.timer = setInterval(tick, 200); }
function tick() {
  if (!P || P.paused) return;
  const msLeft = P.endAt - Date.now(); const left = Math.max(0, Math.ceil(msLeft / 1000));
  if (left !== P.left) { P.left = left; if (left <= 3 && left > 0) beep(660, 0.08); updateTimerUI(); }
  if (msLeft <= 0) { clearInterval(P.timer); P.timer = null; onCountdownEnd(); }
}
function onCountdownEnd() {
  const st = curStep();
  if (st.type === 'work' && P.phase === 'prep') { P.phase = 'run'; beep(990, 0.25); vibe(200); say('¡Ya!'); setCountdown(st.v); renderPlayer(); }
  else { beep(1200, 0.3); vibe([100, 60, 100]); nextStep(); }
}
function enterStep() {
  clearTimers();
  const st = curStep(); P.reps = 0; P.guided = false; P.paused = false;
  if (st.type === 'block') { P.phase = 'run'; setCountdown(5); say('Bloque ' + st.block + '. ' + pil(P.kick.track, st.pillar).name); }
  else if (st.type === 'rest') { P.phase = 'run'; setCountdown(st.v); const nx = nextWork(); say('Descanso' + (nx ? '. Sigue: ' + nx.ex.n : '')); }
  else if (st.t === 't') { P.phase = 'prep'; setCountdown(S.settings.prep); say(st.ex.n + (st.side ? '. ' + st.side : '') + '. ' + st.v + ' segundos'); }
  else { P.phase = 'reps'; say(st.ex.n + (st.side ? '. ' + st.side : '') + '. ' + st.v + ' repeticiones'); }
  renderPlayer();
}
function nextWork() { for (let j = P.i + 1; j < P.steps.length; j++) if (P.steps[j].type === 'work') return P.steps[j]; return null; }
function nextStep() { if (P.i < P.steps.length - 1) { P.i++; enterStep(); } else finishLesson(); }
function prevStep() { if (P.i > 0) { P.i--; while (P.i > 0 && P.steps[P.i].type === 'rest') P.i--; enterStep(); } }
function togglePause() {
  if (!P.timer && !P.paused) return;
  if (P.paused) { P.endAt = Date.now() + P.pausedMs; P.paused = false; }
  else { P.pausedMs = P.endAt - Date.now(); P.paused = true; }
  renderPlayer();

      </div>
      <div class="mt-5 rounded-2xl p-4 text-sm font-bold text-left ${pass ? 'bg-green-50 text-green-700' : 'bg-amber-50 text-amber-700'}">
        ${pass ? (nextL ? `+50 XP y medalla 🏅 del Nivel ${E.lvl}. Siguiente reto sugerido: <b>Nivel ${nextL.n}: ${nextL.title}</b> (${nextItem.name}).` : `+50 XP. Completaste la ruta de ${T_.name}. Sigue repasando para mantener tu nivel. 🥋`)
              : `${!quizOk ? 'Repasa los puntos clave de cada técnica del nivel (pestaña Técnicas). ' : ''}${!physOk ? 'Repite las lecciones del nivel 2–3 veces por semana durante 1–2 semanas y vuelve a intentarlo.' : ''}`}
      </div>
      <div class="flex-1"></div>
      <button data-act="examDone" data-arg="${pass ? 1 : 0}" class="btn3d mt-6 w-full rounded-2xl py-4 font-black text-white text-lg uppercase" style="background:${L.color};border-color:${L.dark}">Continuar</button>
    </div>`);
  }
}
function startTestTimer(i) {
  const t = E.phys[i]; const prep = S.settings.prep; const seq = [];
  (t.s ? ['Lado derecho', 'Lado izquierdo'] : ['']).forEach(side => { seq.push({ label: side, kind: 'prep', secs: prep }); seq.push({ label: side, kind: 'hold', secs: t.v }); });
  E.tt = { i, seq, k: 0, left: seq[0].secs, total: seq[0].secs, endAt: Date.now() + seq[0].secs * 1000, timer: null };
  say(t.n + '. ' + (seq[0].label || '') + '. Prepárate');
  E.tt.timer = setInterval(ttTick, 200); renderExam();
}
function ttTick() {
  const tt = E && E.tt; if (!tt) return;
  const ms = tt.endAt - Date.now(); const left = Math.max(0, Math.ceil(ms / 1000));
  if (left !== tt.left) { tt.left = left; if (left <= 3 && left > 0) beep(660, 0.08); const el = document.getElementById('ttleft'); if (el) el.textContent = fmt(left); const r = document.getElementById('ring'); if (r) r.style.strokeDashoffset = RING_C * (1 - left / tt.total); }
  if (ms <= 0) {
    tt.k++;
    if (tt.k >= tt.seq.length) { clearInterval(tt.timer); beep(1200, 0.4); vibe([120, 60, 120]); say('¡Tiempo! ¿Lo lograste?'); E.tt = null; renderExam(); return; }
    const s = tt.seq[tt.k]; tt.total = s.secs; tt.left = s.secs; tt.endAt = Date.now() + s.secs * 1000;
    if (s.kind === 'hold') { beep(990, 0.25); vibe(200); say('¡Ya!'); } else { beep(1200, 0.3); say('Cambio. ' + s.label); }
    renderExam();
  }
}
function stopTestTimer() { if (E && E.tt) { clearInterval(E.tt.timer); E.tt = null; renderExam(); } }
function renderTestTimer() {
  const tt = E.tt; const s = tt.seq[tt.k]; const t = E.phys[tt.i]; const L = TRACKS[E.tr].levels[E.lvl - 1];
  const hold = s.kind === 'hold';
  return `<div class="fixed inset-0 z-50 bg-white flex flex-col px-6 text-center" style="padding-top:max(24px, env(safe-area-inset-top))">
    <div class="text-xs font-extrabold uppercase text-slate-400">Prueba física</div>
    <div class="text-xl font-black">${t.n}</div>
    ${s.label ? `<div class="mt-2 inline-block mx-auto px-3 py-1 rounded-full text-xs font-black bg-slate-800 text-white">${s.label}</div>` : ''}
    <div class="mt-8">${ringSVG(hold ? L.color : '#AFAFAF', RING_C * (1 - tt.left / tt.total),
      `<div><div class="text-sm font-extrabold uppercase ${hold ? '' : 'text-slate-400'}" style="${hold ? 'color:' + L.color : ''}">${hold ? '¡Ya!' : 'Colócate'}</div><div id="ttleft" class="text-6xl font-black">${fmt(tt.left)}</div></div>`)}</div>
    <div class="mt-6 text-sm font-bold text-slate-500">${t.d}</div>
    <div class="flex-1"></div>
    <button data-act="ttStop" class="btn3d mb-8 w-full rounded-2xl py-4 font-black bg-white border-2 border-slate-200 uppercase">Detener</button>
  </div>`;
}

/* =========================================================
   Progreso, Guía y Ajustes
   ========================================================= */
function renderStats() {
  const week = []; for (let i = 6; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); week.push(d); }
  const dn = ['D', 'L', 'M', 'M', 'J', 'V', 'S']; const feelIc = { easy: '😎', ok: '💪', hard: '🥵' };
  return `<div class="px-4 pt-4 pb-32">
    <h1 class="text-2xl font-black">Tu progreso</h1>
    <div class="grid grid-cols-2 gap-3 mt-4">
      ${[['⚡', S.xp, 'XP total'], ['🔥', liveStreak(), 'Racha actual'], ['🏅', S.best, 'Mejor racha'], ['🥋', S.sessions, 'Sesiones'], ['🦵', doneCount('kick') + '/' + KICKS.length, 'Patadas dominadas'], ['🥊', doneCount('box') + '/' + BOX.length, 'Pies y defensa'], ['🧘', doneCount('flex') + '/' + FLEX.length, 'Flexibilidad'], ['⏱️', S.minutes, 'Minutos']]
        .map(([ic, v, l]) => `<div class="rounded-2xl border-2 border-slate-200 p-3 flex items-center gap-3"><div class="text-2xl">${ic}</div><div><div class="text-xl font-black">${v}</div><div class="text-[11px] font-extrabold text-slate-400 uppercase">${l}</div></div></div>`).join('')}
    </div>
    <div class="mt-5 rounded-2xl border-2 border-slate-200 p-4">
      <div class="font-black">Últimos 7 días</div>
      <div class="grid grid-cols-7 gap-1 mt-3 text-center">${week.map(d => { const on = S.days.includes(dayKey(d)); const today = dayKey(d) === dayKey();
        return `<div><div class="text-[11px] font-extrabold ${today ? 'text-sky-500' : 'text-slate-400'}">${dn[d.getDay()]}</div><div class="mt-1 mx-auto w-9 h-9 rounded-full grid place-items-center ${on ? 'bg-orange-100' : 'bg-slate-100'}">${on ? '🔥' : ''}</div></div>`; }).join('')}</div>
    </div>
    <div class="mt-6 font-black">Historial reciente</div>
    <div class="mt-2 space-y-2">${S.history.length ? S.history.slice(0, 12).map(h => `<div class="flex items-center justify-between rounded-2xl bg-slate-50 p-3">
        <div><div class="font-black text-sm">${h.kind === 'exam' ? '🏆 ' : ''}${h.name}</div><div class="text-xs font-bold text-slate-400">${h.date}${h.mins ? ' · ' + h.mins + ' min' : ''} ${h.feel ? feelIc[h.feel] : ''} ${h.pain ? '🩹' : ''}</div></div>
        <div class="font-black text-amber-500">+${h.xp}</div></div>`).join('') : '<div class="text-sm font-bold text-slate-400">Aún no hay sesiones. ¡Tu primera lección te espera en la Ruta!</div>'}</div>
  </div>`;
}
function renderGuide() {
  const sec = (ic, t, body, open) => `<details class="rounded-2xl border-2 border-slate-200 p-4" ${open ? 'open' : ''}><summary class="font-black flex items-center gap-2 cursor-pointer"><span class="text-xl">${ic}</span>${t}</summary><div class="mt-2 text-sm font-semibold text-slate-600 space-y-2">${body}</div></details>`;
  return `<div class="px-4 pt-4 pb-32 space-y-3">
    <h1 class="text-2xl font-black">Guía del método</h1>
    ${sec('🧭', 'Cómo funciona KickPath', `<p>Tres rutas: <b>🦵 Patadas</b> (23 técnicas en 5 niveles), <b>🥊 Pies y Defensa</b> (footwork, esquivas, bloqueos y defensa de patadas) y <b>🧘 Flexibilidad</b> (isquios, cadera, aductores, splits y flexibilidad activa). Cambia de ruta arriba del mapa.</p><p>Cada lección integra los 5 pilares en orden: <b>Movilidad → Técnica → Drills → Fuerza → Core</b>. Todas las técnicas están abiertas: elige la que quieras dominar. El nodo que rebota es la ruta sugerida, y cada 🏆 es una evaluación para ganar la medalla del nivel.</p><p>En <b>Técnicas</b> ves la animación de cada movimiento fase por fase, en cámara lenta, y un botón a videos reales de YouTube.</p>`, true)}
    ${Object.values(PILLARS).map(p => sec(p.icon, p.name, `<p>${p.desc}</p>`)).join('')}
    ${sec('🥋', 'Cómo combinarla con tus clases de MMA', `<p><b>Día con clase:</b> una lección en modo ⚡ Express (patadas o flexibilidad) temprano o en la tarde. Nada de fuerza pesada.</p><p><b>Después de clase:</b> 10–15 min de flexibilidad; con el cuerpo caliente es cuando más rango ganas.</p><p><b>Día sin clase:</b> una lección completa de patadas + una de flexibilidad (45–60 min).</p><p><b>1 día a la semana:</b> descanso total.</p>`, true)}
    ${sec('📅', 'Frecuencia recomendada', `<p><b>3 a 5 sesiones por semana</b> con 1–2 días de descanso. Puedes alternar: un día patadas, otro boxeo, y flexibilidad después de entrenar o en días de descanso activo.</p><p>Repite cada lección 2–3 veces antes de presentar la evaluación.</p>`)}
    ${sec('🩺', 'Regla del dolor (fisioterapia)', `<p><b>Molestia muscular, ardor o temblor:</b> normal (hasta 3–4 de 10).</p><p><b>Dolor articular agudo o punzante en rodilla, cadera, hombro o espalda baja:</b> para de inmediato y reduce rango y velocidad la siguiente vez.</p><p>Si dura más de 48 h, hay hinchazón u hormigueo, consulta a un fisioterapeuta o médico. Esta app no sustituye una valoración profesional.</p>`)}
    ${sec('📐', 'Cómo medir 90° y 120°', `<p><b>90°:</b> el pie llega a la altura de tu cadera con la pierna estirada. <b>120°:</b> aproximadamente a la altura del pecho/hombro.</p><p>Usa un espejo o graba un video de perfil. Solo cuenta si lo sostienes <b>sin manos y sin inclinar el tronco</b> para compensar.</p>`)}
    ${sec('🏠', 'Seguridad en casa', `<p>Espacio despejado de al menos 2 × 2 m. Entrena descalzo sobre piso antideslizante o con tenis, nunca en calcetines sobre piso liso.</p><p>Nunca patees ni golpees paredes, puertas o muebles. En giros y saltos, practica primero en cámara lenta; si te mareas, detente.</p>`)}
  </div>`;
}
function renderSettings() {
  const tog = (key, ic, lb) => `<button data-act="toggle" data-arg="${key}" class="w-full flex items-center justify-between rounded-2xl border-2 border-slate-200 p-4">
    <span class="font-black">${ic} ${lb}</span><span class="w-12 h-7 rounded-full relative transition ${S.settings[key] ? 'bg-green-500' : 'bg-slate-300'}"><span class="absolute top-1 w-5 h-5 rounded-full bg-white transition-all ${S.settings[key] ? 'left-6' : 'left-1'}"></span></span></button>`;
  const choice = (key, vals, lb) => `<div class="rounded-2xl border-2 border-slate-200 p-4"><div class="font-black">${lb}</div>
    <div class="flex gap-2 mt-2">${vals.map(v => `<button data-act="setval" data-arg="${key}:${v}" class="flex-1 rounded-xl py-2 font-black border-2 ${S.settings[key] === v ? 'border-sky-400 bg-sky-50 text-sky-600' : 'border-slate-200'}">${v}s</button>`).join('')}</div></div>`;
  return `<div class="px-4 pt-4 pb-32 space-y-3">
    <h1 class="text-2xl font-black">Ajustes</h1>
    <div class="rounded-2xl border-2 border-slate-200 p-4"><div class="font-black">🏋️ Tipo de sesión</div>
      <div class="grid grid-cols-2 gap-2 mt-2">
        <button data-act="setmode" data-arg="full" class="rounded-xl py-2 font-black border-2 ${!isExpress() ? 'border-sky-400 bg-sky-50 text-sky-600' : 'border-slate-200'}">💪 Completa</button>
        <button data-act="setmode" data-arg="express" class="rounded-xl py-2 font-black border-2 ${isExpress() ? 'border-sky-400 bg-sky-50 text-sky-600' : 'border-slate-200'}">⚡ Express</button>
      </div>
      <div class="text-xs font-bold text-slate-400 mt-2">Express: 10–15 min, 1 serie, enfocada en técnica y flexibilidad. Úsala el día de tu clase de MMA para no llegar con las piernas cansadas.</div></div>
    ${tog('sound', '🔊', 'Sonidos y pitidos')}
    ${tog('vibe', '📳', 'Vibración')}
    ${tog('voice', '🗣️', 'Voz guía (dice cada ejercicio)')}
    ${choice('rest', [10, 15, 20, 30, 45], '⏳ Descanso entre ejercicios')}
    ${choice('prep', [3, 5, 10], '🧍 Tiempo para colocarte')}
    <div class="rounded-2xl border-2 border-slate-200 p-4">
      <div class="font-black">📲 Ponerla en tu pantalla de inicio</div>
      <div class="text-sm font-bold text-slate-500 mt-1"><b>iPhone (Safari):</b> botón Compartir (□↑) → <b>Agregar a inicio</b>.<br><b>Android (Chrome):</b> menú ⋮ → <b>Agregar a la pantalla principal</b>.</div>
    </div>
    <button data-act="reset" class="w-full rounded-2xl border-2 border-red-200 text-red-500 p-4 font-black">🗑️ Reiniciar todo el progreso</button>
    <div class="text-center text-xs font-bold text-slate-400 pt-2">KickPath MMA v4.0 · Funciona sin internet · Tu progreso se guarda en este celular.</div>
  </div>`;
}

/* =========================================================
   Acciones (delegación de eventos)
   ========================================================= */
function openNode(id) {
  const tr = trackOfId(id);
  const N = TRACKS[tr].nodes; const i = N.findIndex(n => n.id === id); const n = N[i]; const st = nodeStatus(tr, i);
  if (n.type === 'exam') { if (st === 'done') toast('🏆 Ya tienes esta medalla. ¡Puedes repetirla!'); startExam(tr, n.lvl, false); return; }
  UI.sheet = id; render();
}
const ACTIONS = {
  tab: a => { UI.tab = a; UI.sheet = null; render(); window.scrollTo(0, 0); },
  track: a => { UI.track = a; render(); },
  libtrack: a => { UI.libTrack = a; render(); },
  lib: a => { UI.sheet = a; render(); },
  open: a => openNode(a),
  closeSheet: () => { UI.sheet = null; render(); },
  start: a => startLesson(a),
  next: () => nextStep(),
  prev: () => prevStep(),
  pause: () => togglePause(),
  addtime: a => addTime(+a),
  rep: () => addRep(),
  guided: () => toggleGuided(),
  quit: () => ask('¿Salir de la sesión? Se perderá el progreso de esta lección.', 'Salir', quitLesson),
  askYes: () => { const f = ASK; closeAsk(); if (f) f(); },
  askNo: () => closeAsk(),
  aplay: () => { if (AV.step !== null) { AV.step = null; AV.playing = true; } else AV.playing = !AV.playing; const b = document.getElementById('aplay'); if (b) b.textContent = AV.playing ? '⏸' : '▶'; },
  astep: a => { const n = AV.frames.length; AV.step = AV.step === null ? (animState().idx + (+a > 0 ? 0 : 0)) : (AV.step + (+a) + n) % n; AV.playing = false; AV.trail = []; const b = document.getElementById('aplay'); if (b) b.textContent = '▶'; drawAnim(); },
  aspeed: (a, el) => { AV.speed = +a; document.querySelectorAll('.aspd').forEach(b => { const on = b.dataset.arg === a; b.className = 'aspd h-10 px-2 rounded-xl border-2 font-black text-xs ' + (on ? 'border-sky-400 bg-sky-50 text-sky-600' : 'border-slate-200 bg-white'); }); },
  feel: a => { P.result.entry.feel = a; save(); renderSummary(); },
  pain: a => { P.result.entry.pain = a === '1'; save(); renderSummary(); },
  finishSummary: () => { P = null; UI.view = null; UI.tab = 'map'; render(); window.scrollTo(0, 0); },
  jump: a => { const lvl = +a; ask(`Para saltar al Nivel ${lvl} debes aprobar la evaluación del Nivel ${lvl - 1}. ¿Intentarlo?`, 'Intentar', () => startExam(UI.track, lvl - 1, true)); },
  examQuit: () => ask('¿Salir de la evaluación?', 'Salir', () => { if (E && E.tt) clearInterval(E.tt.timer); E = null; UI.view = null; render(); }),
  examBegin: () => { E.phase = 'quiz'; renderExam(); },
  qsel: a => { if (E.checked) return; E.sel = +a; renderExam(); },
  qcheck: () => { if (E.sel === null) return; E.checked = true; const ok = E.sel === E.quiz[E.qi].a; if (ok) { E.score++; beep(1100, 0.15); } else { beep(220, 0.25); vibe(200); } renderExam(); },
  qnext: () => { E.qi++; E.sel = null; E.checked = false; if (E.qi >= E.quiz.length) E.phase = 'phys'; renderExam(); window.scrollTo(0, 0); },
  ttStart: a => startTestTimer(+a),
  ttStop: () => stopTestTimer(),
  tres: a => { const [i, v] = a.split(':'); E.res[+i] = v === '1'; renderExam(); },
  examResult: () => { E.phase = 'result'; const pass = E.res.every(Boolean) && E.score >= passMark(); if (pass) { beep(1300, 0.4); confetti(); } renderExam(); },
  examDone: a => {
    const pass = a === '1'; const T_ = TRACKS[E.tr];
    const firstToday = registerDay(); const examId = T_.examPrefix + E.lvl;
    if (pass) {
      const already = !!S.done[examId];
      if (E.jump) { const idx = T_.nodes.findIndex(n => n.id === examId); for (let j = 0; j <= idx; j++) S.done[T_.nodes[j].id] = true; }
      S.done[examId] = true;
      const xp = (already ? 15 : 50) + (firstToday ? 5 : 0); S.xp += xp;
      S.history.unshift({ date: dayKey(), kind: 'exam', id: examId, name: `Evaluación ${T_.name} Nivel ${E.lvl} (aprobada)`, xp });
    } else {
      const xp = 5 + (firstToday ? 5 : 0); S.xp += xp;
      S.history.unshift({ date: dayKey(), kind: 'exam', id: examId, name: `Evaluación ${T_.name} Nivel ${E.lvl} (intento)`, xp });
    }
    S.history = S.history.slice(0, 60); save();
    UI.track = E.tr; E = null; UI.view = null; UI.tab = 'map'; render(); window.scrollTo(0, 0);
    if (pass) toast('🏅 ¡Medalla de nivel conseguida!');
  },
  setmode: a => { S.settings.mode = a; save(); render(); },
  toggle: a => { S.settings[a] = !S.settings[a]; save(); render(); },
  setval: a => { const [k, v] = a.split(':'); S.settings[k] = +v; save(); render(); },
  reset: () => ask('¿Seguro? Se borrarán XP, racha y técnicas desbloqueadas.', 'Borrar', () => { S = defaultState(); save(); UI.tab = 'map'; render(); toast('Progreso reiniciado'); })
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.act]; if (fn) fn(el.dataset.arg, el);
});

/* Arranque */
render();
window.addEventListener('online', () => { if (UI.view !== 'player') render(); toast('📶 Conexión de vuelta: videos disponibles'); });
window.addEventListener('offline', () => { if (UI.view !== 'player') render(); toast('📴 Sin conexión: puedes seguir entrenando'); });
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
try {
  if ('serviceWorker' in navigator && location.protocol.startsWith('http') && !/claude/.test(location.hostname)) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
} catch (e) {}

</script>
</body>
</html>
